server {
 server_name 107-175-122-81.sslip.io;
 client_max_body_size 64m;
     # 朋友 VPN 流量余量（单网址登录制）：本地应用 127.0.0.1:8765
    location /wg/ {
        alias /var/www/wg-sub/;
        types { application/octet-stream conf; }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header X-Robots-Tag noindex;
        try_files $uri =404;
    }
    location /sr/ {
        alias /var/www/sr-sub/;
        types { }
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }
    location /sub/ {
        alias /var/www/clash-sub/;
        try_files $uri =404;
    }
    location /usage/ {
        proxy_pass http://127.0.0.1:8765/usage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

location / {
  limit_req zone=api_zone burst=600 nodelay;
  proxy_pass http://127.0.0.1:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 600s;
 }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/107-175-122-81.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/107-175-122-81.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = 107-175-122-81.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


 listen 80;
 server_name 107-175-122-81.sslip.io;
    return 404; # managed by Certbot


}