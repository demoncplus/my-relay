services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: newapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: newapi
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U newapi]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --save, '60', '1', --loglevel, warning]
    volumes:
      - ./redis:/data
  new-api:
    image: calciumion/new-api:latest
    restart: unless-stopped
    ports:
      - 127.0.0.1:3000:3000
    environment:
      SQL_DSN: postgresql://newapi:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/newapi
      REDIS_CONN_STRING: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      TZ: Asia/Shanghai
      DEFAULT_LANGUAGE: zh-CN
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_TRUSTED_URL: "https://107-175-122-81.sslip.io"
      GLOBAL_API_RATE_LIMIT: "1800"
      GLOBAL_WEB_RATE_LIMIT: "600"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started